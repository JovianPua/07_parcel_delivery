name: Run pytest

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**.py"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: python -m pytest
